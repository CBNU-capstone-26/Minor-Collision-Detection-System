# SIOT HTTPS 설정입니다. certbot으로 인증서를 받은 뒤(/etc/letsencrypt/live/__DOMAIN__/) install.sh가 이 파일을 씁니다.
# 로그인과 회원가입 요청을 같은 IP에서 분당 10번(몰아서 10번까지)으로 제한해 비밀번호 무차별 대입을 막습니다.
# siot-common.conf의 /api/auth/(login|signup)이 씁니다.
limit_req_zone $binary_remote_addr zone=siot_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/siot-common.conf;
}
