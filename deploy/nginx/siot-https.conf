# SIOT — HTTPS. certbot 으로 인증서를 받은 뒤(/etc/letsencrypt/live/__DOMAIN__/) install.sh 가 이걸 쓴다.
# 로그인·회원가입 요청 제한(같은 IP 분당 10번, 몰아서 10번까지) — 비밀번호 무차별 대입 막기.
# siot-common.conf 의 /api/auth/(login|signup) 이 쓴다
limit_req_zone $binary_remote_addr zone=siot_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include snippets/siot-common.conf;
}
