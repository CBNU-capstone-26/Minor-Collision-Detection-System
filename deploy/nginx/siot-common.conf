# SIOT — 화면(빌드 파일)과 /api(백엔드)를 같은 주소로 내준다. 아래 두 server 설정이 함께 쓴다.
# deploy/install.sh 가 /etc/nginx/snippets/siot-common.conf 로 복사한다.

root /var/www/siot;   # ui/dist 를 install.sh 가 여기로 복사한다(nginx 는 /home 아래를 못 읽는다)
index index.html;

# CCTV 원본 영상 업로드 — nginx 기본 한도(1MB)를 풀고(크기 제한은 디스크),
# 받는 대로 바로 백엔드로 넘긴다(nginx 임시 파일에 한 번 더 쓰지 않게)
client_max_body_size 0;
client_body_timeout 300s;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# 기본 보안 헤더 — 아래 location 에 add_header 를 따로 두지 않아야 모두에 붙는다(nginx 상속 규칙)
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;

# 로그인·회원가입 — 요청 횟수 제한(zone 은 siot-http/https.conf), 넘으면 화면이 읽을 수 있게 JSON 429
location ~ ^/api/auth/(login|signup)$ {
    limit_req zone=siot_auth burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @siot_too_many;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @siot_too_many {
    default_type application/json;
    return 429 '{"detail":"요청이 너무 많습니다. 잠시 후 다시 시도해 주세요."}';
}

location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # 큰 업로드를 바로 흘려보낸다
    proxy_buffering off;           # 영상 재생(Range 요청)도 바로 흘려보낸다
    # 업로드 후 영상 정보 추출·차량 탐지(YOLO, CPU 서버에선 오래 걸림)를 기다린다
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

# 빌드 파일(js·css)은 이름에 내용 해시가 붙어 있어 오래 캐시해도 된다
location /assets/ {
    expires 30d;
    try_files $uri =404;
}

# 화면 주소(/videos/12 등)는 모두 index.html — React 라우터가 처리한다(새로고침해도 404 가 안 나게)
location / {
    try_files $uri $uri/ /index.html;
    expires -1;   # Cache-Control: no-cache — 새로 배포하면 바로 새 화면
}
