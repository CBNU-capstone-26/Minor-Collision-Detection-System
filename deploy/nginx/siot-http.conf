# SIOT HTTP 전용 설정입니다(인증서를 받기 전이나 도메인 없이 IP로 접속할 때).
# deploy/install.sh가 __DOMAIN__을 바꿔 /etc/nginx/sites-available/siot.conf로 설치합니다.
# 로그인과 회원가입 요청을 같은 IP에서 분당 10번(몰아서 10번까지)으로 제한해 비밀번호 무차별 대입을 막습니다.
# siot-common.conf의 /api/auth/(login|signup)이 씁니다.
limit_req_zone $binary_remote_addr zone=siot_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    include snippets/siot-common.conf;
}
