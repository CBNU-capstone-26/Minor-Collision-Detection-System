# SIOT — HTTP 전용(인증서를 받기 전, 또는 도메인 없이 IP 로 접속할 때).
# deploy/install.sh 가 __DOMAIN__ 을 바꿔 /etc/nginx/sites-available/siot.conf 로 설치한다.
# 로그인·회원가입 요청 제한(같은 IP 분당 10번, 몰아서 10번까지) — 비밀번호 무차별 대입 막기.
# siot-common.conf 의 /api/auth/(login|signup) 이 쓴다
limit_req_zone $binary_remote_addr zone=siot_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    include snippets/siot-common.conf;
}
